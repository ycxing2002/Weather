<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>联系我们｜某某科技有限公司</title>
    <meta name="description" content="与某某科技联系，获取专业咨询与合作方案。" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="./index.html">
          <img class="logo" src="./assets/logo.svg" alt="公司Logo" />
          <span>某某科技</span>
        </a>
        <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
        <nav class="nav-links" aria-label="主导航">
          <a href="./index.html" data-nav="home">首页</a>
          <a href="./about.html" data-nav="about">关于我们</a>
          <a href="./services.html" data-nav="services">解决方案</a>
          <a href="./contact.html" data-nav="contact" class="active">联系我们</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <h1>联系我们</h1>
          <p>填写表单，我们将在 1 个工作日内与您联系。</p>
        </div>
      </section>

      <section class="section container contact">
        <div class="grid grid-2">
          <form id="contactForm" class="card form" novalidate>
            <div class="form-row">
              <label for="name">您的称呼</label>
              <input id="name" name="name" type="text" placeholder="张先生 / 李女士" required />
              <small class="error" data-for="name"></small>
            </div>
            <div class="form-row">
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" placeholder="you@company.com" required />
              <small class="error" data-for="email"></small>
            </div>
            <div class="form-row">
              <label for="company">公司</label>
              <input id="company" name="company" type="text" placeholder="某某科技" />
            </div>
            <div class="form-row">
              <label for="phone">电话</label>
              <input id="phone" name="phone" type="tel" placeholder="138xxxx0000" />
            </div>
            <div class="form-row">
              <label for="message">需求与目标</label>
              <textarea id="message" name="message" rows="5" placeholder="请简单描述您的项目、预算与时间计划" required></textarea>
              <small class="error" data-for="message"></small>
            </div>
            <div class="form-row">
              <button type="submit" class="btn btn-primary">提交</button>
              <p id="formStatus" class="muted"></p>
            </div>
          </form>
          <aside>
            <div class="card contact-card">
              <h3>公司信息</h3>
              <p>邮箱：hello@example.com</p>
              <p>电话：400-000-0000</p>
              <p>地址：上海市浦东新区XX路88号</p>
            </div>
            <div class="map-skel card">
              <div class="bar"></div>
              <div class="lines">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
              </div>
              <p class="muted">地图占位（可替换为实际地图组件）</p>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <a class="brand" href="./index.html">
            <img class="logo" src="./assets/logo.svg" alt="公司Logo" />
            <span>某某科技</span>
          </a>
          <p class="muted">专注企业数字化与品牌官网建设。</p>
        </div>
        <nav aria-label="底部导航">
          <a href="./about.html">关于我们</a>
          <a href="./services.html">解决方案</a>
          <a href="./contact.html">联系我们</a>
        </nav>
        <div class="footer-meta">
          <span>© <span id="year"></span> 某某科技有限公司</span>
          <a class="muted" href="#">隐私政策</a>
        </div>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
